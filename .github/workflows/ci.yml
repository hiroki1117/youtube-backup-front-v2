name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# team-practices の CI 品質ゲート（全チェックが merge をブロック）。
# フィードバック目標 10 分以内。pnpm store をキャッシュして高速化する。
jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # packageManager フィールドから pnpm バージョンを解決（corepack 連携）

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Test + coverage (line >= 80%)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Storybook ビルドゲート（team-practices: 既存ゲートと並列の別ジョブ、merge をブロック）。
  # tsc / vite build が検証しない Storybook ランタイム側のバンドル整合（main.ts 設定・addon 登録・
  # デコレータ合成・MSW 初期化・static asset）を検証する。
  # 実 VITE_* は注入しない（Storybook は MSW モックで完結。値は .storybook/main.ts の define で固定）。
  # 成果物 storybook-static/ は CI アーティファクトのみで、prod S3 へは配信しない（deploy.yml は dist/ のみ）。
  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload storybook-static
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7
          if-no-files-found: ignore
