name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# team-practices の CI 品質ゲート（全チェックが merge をブロック）。
# フィードバック目標 10 分以内。pnpm store をキャッシュして高速化する。
jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # packageManager フィールドから pnpm バージョンを解決（corepack 連携）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Test + coverage (line >= 80%)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
